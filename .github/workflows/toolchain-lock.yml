name: Toolchain lockfile
on:
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - .github/workflows/toolchain-lock.yml
permissions:
  contents: read
concurrency:
  group: toolchain-lock-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve the pinned toolchain without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Preserve generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-lockfile
          path: package-lock.json
          retention-days: 3
      - name: Print generated public dependency lock for review
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { createHash } from "node:crypto";
            const lock = readFileSync("package-lock.json", "utf8");
            for (let offset = 0; offset < lock.length; offset += 1000) {
              console.log("GAMMA_LOCKFILE_CHUNK " + JSON.stringify(lock.slice(offset, offset + 1000)));
            }
            console.log("GAMMA_LOCKFILE_SHA256 " + createHash("sha256").update(lock).digest("hex"));
          '
