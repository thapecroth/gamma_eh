name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag on main (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GAMMA_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GAMMA_TEST_WEBGPU: '1'
    steps:
      - name: Validate tag format
        run: |
          if [[ ! "$GAMMA_RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected a canonical vX.Y.Z tag.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Require a tag already merged into main
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module -e 'import {readFileSync} from "node:fs"; import {releaseVersion} from "./scripts/package-release.mjs"; releaseVersion(JSON.parse(readFileSync("package.json")).version, JSON.parse(readFileSync("apps/extension/manifest.json")).version, process.env.GAMMA_RELEASE_TAG);'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:release
      - run: npm run test:agents
      - run: pip install pytest==8.4.2
      - run: python -m pytest training
      - run: npx playwright install --with-deps chromium
      - name: Check browser capabilities
        timeout-minutes: 2
        run: npm run check:environment
      - name: Build fresh public assets and package ZIPs
        run: npm run release:package
      - name: Test the actual extracted release packages
        run: |
          GAMMA_BUILD_BACKUP=$(mktemp -d)
          mv dist/extension "$GAMMA_BUILD_BACKUP/extension"
          mv dist/web "$GAMMA_BUILD_BACKUP/web"
          mkdir dist/extension dist/web
          unzip -q "artifacts/releases/$GAMMA_RELEASE_TAG/gamma-eh-chrome-$GAMMA_RELEASE_TAG.zip" -d dist/extension
          unzip -q "artifacts/releases/$GAMMA_RELEASE_TAG/gamma-eh-web-$GAMMA_RELEASE_TAG.zip" -d dist/web
          npm run test:browser
          npm run test:extension
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: artifacts/releases/${{ inputs.tag || github.ref_name }}/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-browser-evidence
          path: |
            artifacts/environment.json
            artifacts/browser-smoke.json
            artifacts/editor-desktop.png
            artifacts/editor-mobile.png
            artifacts/agents/extension-*/browser.json
            artifacts/agents/extension-*/*.png
            artifacts/agents/extension-*/trace.zip
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: verify-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GAMMA_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Verify archive checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish an experimental prerelease (never replace existing assets)
        working-directory: release-assets
        run: |
          gh release create "$GAMMA_RELEASE_TAG" \
            "gamma-eh-chrome-$GAMMA_RELEASE_TAG.zip" \
            "gamma-eh-web-$GAMMA_RELEASE_TAG.zip" SHA256SUMS.txt \
            --verify-tag --prerelease --title "Gamma EH $GAMMA_RELEASE_TAG (experimental)" \
            --notes-file RELEASE_NOTES.md
